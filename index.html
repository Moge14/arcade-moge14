<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE — Game Launcher</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

:root {
  --green: #00ff88;
  --red: #ff4466;
  --blue: #44aaff;
  --yellow: #ffdd00;
  --bg: #07070d;
  --panel: #0d0d1a;
  --border: rgba(0,255,136,0.15);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--green);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: crosshair;
}

/* Scanline overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,255,136,0.012) 3px,
    rgba(0,255,136,0.012) 4px
  );
  pointer-events: none;
  z-index: 100;
}

/* CRT vignette */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
  pointer-events: none;
  z-index: 99;
}

/* ── HEADER ── */
header {
  position: relative;
  text-align: center;
  padding: 3.5rem 1rem 2rem;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}

.header-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 120% at 50% 0%, rgba(0,255,136,0.07) 0%, transparent 70%);
  pointer-events: none;
}

.insert-coin {
  font-size: 0.7rem;
  letter-spacing: 0.4em;
  color: rgba(0,255,136,0.4);
  animation: blink 1.2s step-end infinite;
  margin-bottom: 0.8rem;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

h1 {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: clamp(3rem, 10vw, 6rem);
  letter-spacing: 0.18em;
  line-height: 1;
  color: var(--green);
  text-shadow:
    0 0 20px var(--green),
    0 0 60px rgba(0,255,136,0.5),
    0 0 120px rgba(0,255,136,0.2);
  position: relative;
}

h1::before {
  content: 'ARCADE';
  position: absolute;
  inset: 0;
  color: transparent;
  -webkit-text-stroke: 1px rgba(0,255,136,0.2);
  transform: translate(3px, 3px);
  z-index: -1;
}

.subtitle {
  font-size: 0.75rem;
  letter-spacing: 0.5em;
  color: rgba(0,255,136,0.45);
  margin-top: 0.6rem;
  text-transform: uppercase;
}

/* Decorative corner brackets */
.corner {
  position: absolute;
  width: 20px;
  height: 20px;
  border-color: rgba(0,255,136,0.4);
  border-style: solid;
}
.corner-tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
.corner-tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
.corner-bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
.corner-br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

/* ── STATS BAR ── */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 3rem;
  padding: 0.7rem 1rem;
  font-size: 0.68rem;
  letter-spacing: 0.2em;
  color: rgba(0,255,136,0.35);
  border-bottom: 1px solid var(--border);
  background: rgba(0,255,136,0.02);
}

.stats-bar .val { color: rgba(0,255,136,0.7); }

/* ── MAIN GRID ── */
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 3rem 1.5rem 5rem;
}

.section-label {
  font-size: 0.65rem;
  letter-spacing: 0.5em;
  color: rgba(0,255,136,0.35);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}

.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── GAME GRID ── */
.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1.2rem;
}

/* ── GAME CARD ── */
.game-card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 0;
  overflow: hidden;
  text-decoration: none;
  display: block;
  transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  animation: cardIn 0.4s ease both;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.game-card:nth-child(1) { animation-delay: 0.05s; }
.game-card:nth-child(2) { animation-delay: 0.1s; }
.game-card:nth-child(3) { animation-delay: 0.15s; }
.game-card:nth-child(4) { animation-delay: 0.2s; }
.game-card:nth-child(5) { animation-delay: 0.25s; }
.game-card:nth-child(6) { animation-delay: 0.3s; }

.game-card:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: var(--accent, var(--green));
  box-shadow: 0 0 24px rgba(0,255,136,0.18), 0 8px 32px rgba(0,0,0,0.5);
  z-index: 2;
}

/* Animated top border on hover */
.game-card::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent, var(--green)), transparent);
  transition: left 0.3s ease;
}
.game-card:hover::before { left: 100%; }

/* Preview canvas area */
.card-preview {
  width: 100%;
  aspect-ratio: 4/3;
  background: #050508;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* Pixel art icons drawn with box-shadow */
.pixel-art {
  position: relative;
  image-rendering: pixelated;
}

/* Grid lines in preview */
.card-preview::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 11px, rgba(255,255,255,0.025) 11px, rgba(255,255,255,0.025) 12px),
    repeating-linear-gradient(90deg, transparent, transparent 11px, rgba(255,255,255,0.025) 11px, rgba(255,255,255,0.025) 12px);
}

.card-icon {
  font-size: 3.2rem;
  filter: drop-shadow(0 0 12px var(--accent, var(--green)));
  position: relative;
  z-index: 1;
  animation: iconPulse 3s ease-in-out infinite;
}

@keyframes iconPulse {
  0%,100% { transform: scale(1); filter: drop-shadow(0 0 10px var(--accent, var(--green))); }
  50% { transform: scale(1.08); filter: drop-shadow(0 0 22px var(--accent, var(--green))); }
}

.card-badge {
  position: absolute;
  top: 8px; right: 8px;
  font-size: 0.55rem;
  letter-spacing: 0.15em;
  padding: 2px 7px;
  border: 1px solid var(--accent, var(--green));
  color: var(--accent, var(--green));
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
}

.card-badge.coming-soon {
  border-color: rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.25);
}

/* Card body */
.card-body {
  padding: 0.9rem 1rem 1rem;
  border-top: 1px solid var(--border);
}

.card-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--accent, var(--green));
  text-shadow: 0 0 8px var(--accent, var(--green));
  margin-bottom: 0.35rem;
}

.card-desc {
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.3);
  line-height: 1.6;
}

.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 0.75rem;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.2);
}

.card-keys {
  display: flex;
  gap: 4px;
}

.key {
  padding: 1px 5px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 2px;
  font-size: 0.55rem;
  color: rgba(255,255,255,0.25);
}

/* Locked/Coming soon state */
.game-card.locked {
  opacity: 0.45;
  pointer-events: none;
  filter: grayscale(0.6);
}

.game-card.locked .card-preview::after {
  content: 'COMING SOON';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  color: rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.4);
}

/* ── PLAY BUTTON on hover ── */
.card-play {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0);
  opacity: 0;
  transition: opacity 0.2s, background 0.2s;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 0.3em;
  color: var(--accent, var(--green));
  text-shadow: 0 0 12px var(--accent, var(--green));
}

.game-card:hover .card-play {
  opacity: 1;
  background: rgba(0,0,0,0.45);
}

/* ── FOOTER ── */
footer {
  text-align: center;
  padding: 1.5rem;
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  color: rgba(0,255,136,0.18);
  border-top: 1px solid var(--border);
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,255,136,0.4); }

/* ── SNAKE MINI ANIMATION ── */
@keyframes snakeMove {
  0%   { transform: translateX(0); }
  100% { transform: translateX(4px); }
}
</style>
</head>
<body>

<header>
  <div class="header-bg"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="insert-coin">▶ INSERT COIN TO CONTINUE ◀</div>
  <h1>ARCADE</h1>
  <div class="subtitle">Select Your Game</div>
</header>

<div class="stats-bar">
  <span>GAMES AVAILABLE <span class="val" id="availCount">—</span></span>
  <span>PLAYER <span class="val">1UP</span></span>
  <span>STATUS <span class="val">ONLINE</span></span>
</div>

<main>
  <div class="section-label">// AVAILABLE NOW</div>

  <div class="games-grid" id="grid"></div>
</main>

<footer>
  ARCADE v1.0 &nbsp;·&nbsp; BUILT WITH HTML &nbsp;·&nbsp; HOSTED ON GITHUB PAGES
</footer>

<script>
// ── GAME REGISTRY ──
// To add a new game: add an entry to this array.
// Set `url` to the path of the game's index.html, e.g. 'snake/index.html'
// Set `locked: true` for coming-soon games.
const GAMES = [
  {
    title: 'SNAKE',
    desc: 'Navigate the grid. Eat the fruit. Don\'t bite yourself.',
    icon: '🐍',
    accent: '#00ff88',
    url: 'snake/index.html',
    keys: ['WASD', '↑↓←→'],
    badge: 'PLAY',
    locked: false,
  },
  {
    title: 'TETRIS',
    desc: 'Stack the falling blocks. Clear the lines. Hold on.',
    icon: '🟦',
    accent: '#44aaff',
    url: 'tetris/index.html',
    keys: ['WASD', 'SPC'],
    badge: 'COMING',
    locked: true,
  },
  {
    title: 'BREAKOUT',
    desc: 'Smash every brick. Don\'t let the ball drop.',
    icon: '🔴',
    accent: '#ff4466',
    url: 'breakout/index.html',
    keys: ['←→', 'SPC'],
    badge: 'COMING',
    locked: true,
  },
  {
    title: 'PONG',
    desc: 'The original. Two paddles. One ball. Pure reflex.',
    icon: '🏓',
    accent: '#ffdd00',
    url: 'pong/index.html',
    keys: ['WS', '↑↓'],
    badge: 'COMING',
    locked: true,
  },
  {
    title: 'ASTEROIDS',
    desc: 'Blast the rocks before they blast you.',
    icon: '🚀',
    accent: '#cc88ff',
    url: 'asteroids/index.html',
    keys: ['WASD', 'SPC'],
    badge: 'COMING',
    locked: true,
  },
  {
    title: 'MINESWEEPER',
    desc: 'Every click is a gamble. Find all the mines.',
    icon: '💣',
    accent: '#ff8833',
    url: 'minesweeper/index.html',
    keys: ['CLICK', 'R-CLK'],
    badge: 'COMING',
    locked: true,
  },
];

// ── RENDER ──
const grid = document.getElementById('grid');
const availCount = document.getElementById('availCount');

let available = 0;

GAMES.forEach(game => {
  if (!game.locked) available++;

  const card = document.createElement(game.locked ? 'div' : 'a');
  if (!game.locked) card.href = game.url;
  card.className = 'game-card' + (game.locked ? ' locked' : '');
  card.style.setProperty('--accent', game.accent);

  card.innerHTML = `
    <div class="card-preview">
      <span class="card-icon">${game.icon}</span>
      ${!game.locked ? `<div class="card-play">▶ PLAY</div>` : ''}
      <div class="card-badge ${game.locked ? 'coming-soon' : ''}">${game.badge}</div>
    </div>
    <div class="card-body">
      <div class="card-title">${game.title}</div>
      <div class="card-desc">${game.desc}</div>
      <div class="card-meta">
        <div class="card-keys">
          ${game.keys.map(k => `<span class="key">${k}</span>`).join('')}
        </div>
        <span>${game.locked ? 'LOCKED' : 'READY'}</span>
      </div>
    </div>
  `;

  grid.appendChild(card);
});

availCount.textContent = available;
</script>

</body>
</html>
