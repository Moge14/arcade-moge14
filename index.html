<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE — Game Launcher</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

:root {
  --green: #00ff88;
  --red: #ff4466;
  --blue: #44aaff;
  --yellow: #ffdd00;
  --bg: #07070d;
  --panel: #0d0d1a;
  --border: rgba(0,255,136,0.15);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--green);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: crosshair;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 3px,
    rgba(0,255,136,0.012) 3px, rgba(0,255,136,0.012) 4px
  );
  pointer-events: none;
  z-index: 100;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
  pointer-events: none;
  z-index: 99;
}

/* ── PASSWORD SCREEN ── */
#passwordScreen {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  gap: 1.2rem;
}

.pw-box {
  position: relative;
  border: 1px solid rgba(0,255,136,0.25);
  padding: 2.5rem 2.5rem 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.2rem;
  background: rgba(0,255,136,0.02);
  box-shadow: 0 0 40px rgba(0,255,136,0.08);
  min-width: 300px;
  max-width: 360px;
  width: 90vw;
}

.pw-corner {
  position: absolute;
  width: 14px; height: 14px;
  border-color: rgba(0,255,136,0.5);
  border-style: solid;
}
.pw-corner.tl { top: 8px;    left: 8px;  border-width: 2px 0 0 2px; }
.pw-corner.tr { top: 8px;    right: 8px; border-width: 2px 2px 0 0; }
.pw-corner.bl { bottom: 8px; left: 8px;  border-width: 0 0 2px 2px; }
.pw-corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

.pw-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1.6rem;
  letter-spacing: 0.25em;
  color: var(--green);
  text-shadow: 0 0 20px var(--green), 0 0 50px rgba(0,255,136,0.3);
}

.pw-subtitle {
  font-size: 0.62rem;
  letter-spacing: 0.3em;
  color: rgba(0,255,136,0.35);
  text-align: center;
}

#pwInput {
  width: 100%;
  background: rgba(0,255,136,0.04);
  border: 1px solid rgba(0,255,136,0.3);
  color: var(--green);
  font-family: 'Orbitron', monospace;
  font-size: 1.1rem;
  letter-spacing: 0.3em;
  padding: 0.7rem 1rem;
  text-align: center;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
#pwInput:focus {
  border-color: var(--green);
  box-shadow: 0 0 16px rgba(0,255,136,0.2);
}
#pwInput.shake {
  animation: shake 0.4s ease;
  border-color: var(--red);
  box-shadow: 0 0 16px rgba(255,68,102,0.3);
}
#pwInput.success {
  border-color: var(--green);
  box-shadow: 0 0 24px rgba(0,255,136,0.5);
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-8px); }
  40%     { transform: translateX(8px); }
  60%     { transform: translateX(-5px); }
  80%     { transform: translateX(5px); }
}

.pw-error {
  font-size: 0.62rem;
  letter-spacing: 0.2em;
  color: var(--red);
  text-shadow: 0 0 8px var(--red);
  min-height: 0.9rem;
  text-align: center;
}

#pwBtn {
  width: 100%;
  padding: 0.65rem;
  background: transparent;
  border: 1px solid var(--green);
  color: var(--green);
  font-family: 'Orbitron', sans-serif;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 0 10px rgba(0,255,136,0.15);
}
#pwBtn:hover {
  background: rgba(0,255,136,0.1);
  box-shadow: 0 0 22px rgba(0,255,136,0.35);
}

.pw-attempts {
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  color: rgba(0,255,136,0.2);
  min-height: 1rem;
  text-align: center;
}

/* ── LAUNCHER ── */
#launcher { display: none; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeIn 0.6s ease both; }

header {
  position: relative;
  text-align: center;
  padding: 3.5rem 1rem 2rem;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}

.header-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 120% at 50% 0%, rgba(0,255,136,0.07) 0%, transparent 70%);
  pointer-events: none;
}

.insert-coin {
  font-size: 0.7rem;
  letter-spacing: 0.4em;
  color: rgba(0,255,136,0.4);
  animation: blink 1.2s step-end infinite;
  margin-bottom: 0.8rem;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

h1 {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: clamp(3rem, 10vw, 6rem);
  letter-spacing: 0.18em;
  line-height: 1;
  color: var(--green);
  text-shadow: 0 0 20px var(--green), 0 0 60px rgba(0,255,136,0.5), 0 0 120px rgba(0,255,136,0.2);
  position: relative;
}
h1::before {
  content: 'ARCADE';
  position: absolute; inset: 0;
  color: transparent;
  -webkit-text-stroke: 1px rgba(0,255,136,0.2);
  transform: translate(3px, 3px);
  z-index: -1;
}

.subtitle {
  font-size: 0.75rem;
  letter-spacing: 0.5em;
  color: rgba(0,255,136,0.45);
  margin-top: 0.6rem;
}

.corner { position: absolute; width: 20px; height: 20px; border-color: rgba(0,255,136,0.4); border-style: solid; }
.corner-tl { top: 16px;    left: 16px;  border-width: 2px 0 0 2px; }
.corner-tr { top: 16px;    right: 16px; border-width: 2px 2px 0 0; }
.corner-bl { bottom: 16px; left: 16px;  border-width: 0 0 2px 2px; }
.corner-br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

.stats-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 2.5rem;
  padding: 0.7rem 1rem;
  font-size: 0.68rem;
  letter-spacing: 0.2em;
  color: rgba(0,255,136,0.35);
  border-bottom: 1px solid var(--border);
  background: rgba(0,255,136,0.02);
}
.stats-bar .val { color: rgba(0,255,136,0.7); }

.logout-btn {
  background: transparent;
  border: 1px solid rgba(0,255,136,0.2);
  color: rgba(0,255,136,0.35);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  padding: 3px 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.logout-btn:hover { border-color: var(--red); color: var(--red); }

main { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }

.section-label {
  font-size: 0.65rem;
  letter-spacing: 0.5em;
  color: rgba(0,255,136,0.35);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1.2rem;
}

.game-card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  overflow: hidden;
  text-decoration: none;
  display: block;
  transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  animation: cardIn 0.4s ease both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.game-card:nth-child(1){animation-delay:0.05s}
.game-card:nth-child(2){animation-delay:0.10s}
.game-card:nth-child(3){animation-delay:0.15s}
.game-card:nth-child(4){animation-delay:0.20s}
.game-card:nth-child(5){animation-delay:0.25s}
.game-card:nth-child(6){animation-delay:0.30s}

.game-card:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: var(--accent, var(--green));
  box-shadow: 0 0 24px rgba(0,255,136,0.18), 0 8px 32px rgba(0,0,0,0.5);
  z-index: 2;
}
.game-card::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent, var(--green)), transparent);
  transition: left 0.3s ease;
}
.game-card:hover::before { left: 100%; }

.card-preview {
  width: 100%;
  aspect-ratio: 4/3;
  background: #050508;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.card-preview::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 11px, rgba(255,255,255,0.025) 11px, rgba(255,255,255,0.025) 12px),
    repeating-linear-gradient(90deg, transparent, transparent 11px, rgba(255,255,255,0.025) 11px, rgba(255,255,255,0.025) 12px);
}

.card-icon {
  font-size: 3.2rem;
  filter: drop-shadow(0 0 12px var(--accent, var(--green)));
  position: relative; z-index: 1;
  animation: iconPulse 3s ease-in-out infinite;
}
@keyframes iconPulse {
  0%,100%{ transform:scale(1);    filter:drop-shadow(0 0 10px var(--accent,var(--green))); }
  50%    { transform:scale(1.08); filter:drop-shadow(0 0 22px var(--accent,var(--green))); }
}

.card-badge {
  position: absolute; top: 8px; right: 8px;
  font-size: 0.55rem; letter-spacing: 0.15em;
  padding: 2px 7px;
  border: 1px solid var(--accent, var(--green));
  color: var(--accent, var(--green));
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
}
.card-badge.coming-soon { border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.25); }

.card-body { padding: 0.9rem 1rem 1rem; border-top: 1px solid var(--border); }

.card-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.9rem; font-weight: 700; letter-spacing: 0.12em;
  color: var(--accent, var(--green));
  text-shadow: 0 0 8px var(--accent, var(--green));
  margin-bottom: 0.35rem;
}

.card-desc { font-size: 0.65rem; letter-spacing: 0.08em; color: rgba(255,255,255,0.3); line-height: 1.6; }

.card-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 0.75rem; font-size: 0.6rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.2);
}
.card-keys { display: flex; gap: 4px; }
.key { padding: 1px 5px; border: 1px solid rgba(255,255,255,0.12); border-radius: 2px; font-size: 0.55rem; color: rgba(255,255,255,0.25); }

.game-card.locked { opacity: 0.45; pointer-events: none; filter: grayscale(0.6); }
.game-card.locked .card-preview::after {
  content: 'COMING SOON';
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Orbitron', sans-serif; font-size: 0.6rem; letter-spacing: 0.3em;
  color: rgba(255,255,255,0.2); background: rgba(0,0,0,0.4);
}

.card-play {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0); opacity: 0;
  transition: opacity 0.2s, background 0.2s;
  font-family: 'Orbitron', sans-serif; font-size: 0.75rem; letter-spacing: 0.3em;
  color: var(--accent, var(--green)); text-shadow: 0 0 12px var(--accent, var(--green));
}
.game-card:hover .card-play { opacity: 1; background: rgba(0,0,0,0.45); }

/* ── BLOG / DEVLOG ── */
.devlog-section {
  margin-top: 4rem;
}

.devlog-grid {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

.devlog-post {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 1.1rem 1.4rem 1.1rem 1.3rem;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0 1.4rem;
  align-items: start;
  animation: cardIn 0.4s ease both;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.devlog-post::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--post-accent, var(--green));
  box-shadow: 0 0 12px var(--post-accent, var(--green));
  opacity: 0.7;
}

.devlog-post:hover {
  border-color: rgba(0,255,136,0.25);
  box-shadow: 0 0 18px rgba(0,255,136,0.06);
}

.devlog-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.3rem;
  min-width: 80px;
  padding-top: 0.1rem;
}

.devlog-date {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  color: rgba(0,255,136,0.3);
  white-space: nowrap;
}

.devlog-tag {
  font-size: 0.52rem;
  letter-spacing: 0.18em;
  padding: 2px 6px;
  border: 1px solid var(--post-accent, var(--green));
  color: var(--post-accent, var(--green));
  opacity: 0.75;
  white-space: nowrap;
}

.devlog-content {}

.devlog-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: rgba(0,255,136,0.9);
  margin-bottom: 0.45rem;
  line-height: 1.4;
}

.devlog-body {
  font-size: 0.67rem;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.38);
  line-height: 1.75;
}

.devlog-empty {
  font-size: 0.65rem;
  letter-spacing: 0.3em;
  color: rgba(0,255,136,0.2);
  text-align: center;
  padding: 2rem 0;
}

footer {
  text-align: center; padding: 1.5rem;
  font-size: 0.6rem; letter-spacing: 0.3em;
  color: rgba(0,255,136,0.18); border-top: 1px solid var(--border);
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,255,136,0.4); }
</style>
</head>
<body>

<!-- ── PASSWORD SCREEN ── -->
<div id="passwordScreen">
  <div class="pw-box">
    <div class="pw-corner tl"></div>
    <div class="pw-corner tr"></div>
    <div class="pw-corner bl"></div>
    <div class="pw-corner br"></div>
    <div class="pw-title">ARCADE</div>
    <div class="pw-subtitle">ENTER ACCESS CODE TO CONTINUE</div>
    <input id="pwInput" type="password" maxlength="20" placeholder="••••••••" autocomplete="off" spellcheck="false" />
    <div class="pw-error" id="pwError"></div>
    <button id="pwBtn">AUTHENTICATE</button>
    <div class="pw-attempts" id="pwAttempts"></div>
  </div>
</div>

<!-- ── LAUNCHER ── -->
<div id="launcher">
  <header>
    <div class="header-bg"></div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="insert-coin">▶ INSERT COIN TO CONTINUE ◀</div>
    <h1>ARCADE</h1>
    <div class="subtitle">Select Your Game</div>
  </header>

  <div class="stats-bar">
    <span>GAMES AVAILABLE <span class="val" id="availCount">—</span></span>
    <span>PLAYER <span class="val">1UP</span></span>
    <span>STATUS <span class="val">ONLINE</span></span>
    <button class="logout-btn" onclick="logout()">LOGOUT</button>
  </div>

  <main>
    <div class="section-label">// AVAILABLE NOW</div>
    <div class="games-grid" id="grid"></div>

    <!-- ── DEVLOG / BLOG ── -->
    <div class="devlog-section">
      <div class="section-label">// DEVLOG</div>
      <div class="devlog-grid" id="devlog"></div>
    </div>
  </main>

  <footer>ARCADE v1.0 &nbsp;·&nbsp; BUILT WITH HTML &nbsp;·&nbsp; HOSTED ON GITHUB PAGES</footer>
</div>

<script>
// ════════════════════════════════════
//  ⚙️  SET YOUR PASSWORD HERE
// ════════════════════════════════════
const PASSWORD = 'arcade2024';
// ════════════════════════════════════

//

//    date    — displayed as-is, e.g. "2025-07-09" or "JULY 2025"
//    tag     — short label like "UPDATE", "NEW GAME", "HOTFIX", etc.
//    title   — headline for the post
//    body    — the full text (supports \n for line breaks)
//    accent  — optional colour for the left bar + tag (CSS colour string)
//              defaults to green if omitted
// ════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════


const STORAGE_KEY  = 'arcade_auth';
const MAX_ATTEMPTS = 5;
const LOCKOUT_MS   = 5 * 60 * 1000; // 5 minutes

function isAuthed()  { return localStorage.getItem(STORAGE_KEY) === 'true'; }
function login()     { localStorage.setItem(STORAGE_KEY, 'true'); }
function logout()    { localStorage.removeItem(STORAGE_KEY); location.reload(); }

function getAttempts() {
  return JSON.parse(localStorage.getItem('arcade_attempts') || '{"count":0,"lockUntil":0}');
}
function saveAttempts(d) { localStorage.setItem('arcade_attempts', JSON.stringify(d)); }

function lockSecsLeft() {
  const d = getAttempts();
  return d.lockUntil > Date.now() ? Math.ceil((d.lockUntil - Date.now()) / 1000) : 0;
}

// ── Game registry ──
const GAMES = [
  {

    desc: "Navigate the grid. Eat the fruit. Don't bite yourself.",

  {

  {

  {

  },
  {
    title: 'PONG',

function buildGrid() {
  const grid = document.getElementById('grid');
  const availCount = document.getElementById('availCount');
  let available = 0;

  GAMES.forEach(game => {
    if (!game.locked) available++;
    const card = document.createElement(game.locked ? 'div' : 'a');
    if (!game.locked) card.href = game.url;
    card.className = 'game-card' + (game.locked ? ' locked' : '');
    card.style.setProperty('--accent', game.accent);
    card.innerHTML = `
      <div class="card-preview">
        <span class="card-icon">${game.icon}</span>
        ${!game.locked ? `<div class="card-play">▶ PLAY</div>` : ''}
        <div class="card-badge ${game.locked ? 'coming-soon' : ''}">${game.badge}</div>
      </div>
      <div class="card-body">
        <div class="card-title">${game.title}</div>
        <div class="card-desc">${game.desc}</div>
        <div class="card-meta">
          <div class="card-keys">${game.keys.map(k => `<span class="key">${k}</span>`).join('')}</div>
          <span>${game.locked ? 'LOCKED' : 'READY'}</span>
        </div>
      </div>`;
    grid.appendChild(card);
  });

  availCount.textContent = available;
}

function buildDevlog() {
  const container = document.getElementById('devlog');
  if (!POSTS.length) {
    container.innerHTML = '<div class="devlog-empty">NO POSTS YET — CHECK BACK SOON</div>';
    return;
  }
  POSTS.forEach((post, i) => {
    const el = document.createElement('div');
    el.className = 'devlog-post';
    el.style.setProperty('--post-accent', post.accent || 'var(--green)');
    el.style.animationDelay = `${0.05 + i * 0.07}s`;
    // convert \n in body to <br>
    const bodyHtml = (post.body || '').replace(/\n/g, '<br>');
    el.innerHTML = `
      <div class="devlog-meta">
        <span class="devlog-date">${post.date || ''}</span>
        ${post.tag ? `<span class="devlog-tag">${post.tag}</span>` : ''}
      </div>
      <div class="devlog-content">
        <div class="devlog-title">${post.title || ''}</div>
        <div class="devlog-body">${bodyHtml}</div>
      </div>`;
    container.appendChild(el);
  });
}

function showLauncher() {
  document.getElementById('passwordScreen').style.display = 'none';
  const el = document.getElementById('launcher');
  el.style.display = 'block';
  buildGrid();
  buildDevlog();
}

// ── Password UI ──
const pwInput    = document.getElementById('pwInput');
const pwBtn      = document.getElementById('pwBtn');
const pwError    = document.getElementById('pwError');
const pwAttempts = document.getElementById('pwAttempts');

function updateLockUI() {
  const secs = lockSecsLeft();
  if (secs > 0) {
    pwInput.disabled = pwBtn.disabled = true;
    pwError.textContent = '';
    pwAttempts.innerHTML = `<span style="color:var(--red)">LOCKED — try again in ${secs}s</span>`;
    setTimeout(updateLockUI, 1000);
  } else {
    pwInput.disabled = pwBtn.disabled = false;
  }
}

function tryPassword() {
  if (lockSecsLeft() > 0) return;
  const val = pwInput.value.trim();
  if (!val) return;

  if (val === PASSWORD) {
    pwInput.classList.add('success');
    pwError.textContent = '';
    pwAttempts.textContent = '';
    saveAttempts({ count: 0, lockUntil: 0 });
    login();
    setTimeout(showLauncher, 500);
  } else {
    const d = getAttempts();
    d.count++;
    if (d.count >= MAX_ATTEMPTS) { d.lockUntil = Date.now() + LOCKOUT_MS; d.count = 0; }
    saveAttempts(d);

    pwInput.value = '';
    pwInput.classList.remove('shake');
    void pwInput.offsetWidth;
    pwInput.classList.add('shake');
    setTimeout(() => pwInput.classList.remove('shake'), 400);

    if (lockSecsLeft() > 0) {
      pwError.textContent = 'TOO MANY ATTEMPTS';
      updateLockUI();
    } else {
      const rem = MAX_ATTEMPTS - d.count;
      pwError.textContent = 'INVALID CODE';
      pwAttempts.textContent = `${rem} attempt${rem !== 1 ? 's' : ''} remaining`;
    }
  }
}

pwBtn.addEventListener('click', tryPassword);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryPassword(); });

// ── Boot ──
if (isAuthed()) {
  showLauncher();
} else {
  updateLockUI();
  pwInput.focus();
}
</script>
