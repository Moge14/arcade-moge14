<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironhold</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--red:#ff4466;--red2:rgba(255,68,102,0.4);--red3:rgba(255,68,102,0.08);--bg:#0a0008;--bg2:#060004;}
  body{background:var(--bg);min-height:100vh;font-family:'Share Tech Mono',monospace;color:var(--red);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,68,102,0.010) 2px,rgba(255,68,102,0.010) 4px);pointer-events:none;z-index:50;}
  .back-btn{position:fixed;top:1rem;left:1rem;z-index:200;padding:0.4rem 0.9rem;background:transparent;border:1px solid rgba(255,68,102,0.3);color:rgba(255,68,102,0.5);font-family:'Share Tech Mono',monospace;font-size:0.65rem;letter-spacing:0.15em;text-decoration:none;transition:all 0.2s;}
  .back-btn:hover{border-color:var(--red);color:var(--red);box-shadow:0 0 12px rgba(255,68,102,0.25);}
  h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(1.4rem,3vw,2rem);letter-spacing:0.35em;color:var(--red);text-shadow:0 0 20px var(--red),0 0 50px rgba(255,68,102,0.35);margin-bottom:0.4rem;}

  /* ── Top bar ── */
  .top-bar{display:flex;align-items:center;gap:1.2rem;margin-bottom:0.5rem;font-size:0.68rem;letter-spacing:0.1em;flex-wrap:wrap;justify-content:center;}
  .res-group{display:flex;gap:0.8rem;}
  .res{display:flex;align-items:center;gap:0.35rem;color:rgba(255,68,102,0.55);}
  .res .icon{font-size:0.85rem;}
  .res .val{color:var(--red);}
  .res .cap{color:rgba(255,68,102,0.3);font-size:0.58rem;}
  .divider{color:rgba(255,68,102,0.2);}
  .phase-badge{font-family:'Orbitron',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:0.2em;padding:0.25rem 0.7rem;border:1px solid var(--red);color:var(--red);box-shadow:0 0 10px rgba(255,68,102,0.25);}
  .phase-badge.night{border-color:#ff2200;color:#ff2200;box-shadow:0 0 10px rgba(255,34,0,0.4);animation:nightpulse 1s ease-in-out infinite;}
  @keyframes nightpulse{0%,100%{opacity:1}50%{opacity:0.6}}
  .timer-wrap{display:flex;align-items:center;gap:0.5rem;font-size:0.65rem;color:rgba(255,68,102,0.5);}
  .timer-val{color:var(--red);font-family:'Orbitron',sans-serif;font-size:0.75rem;min-width:2.5rem;}

  /* ── Layout ── */
  .main{display:flex;gap:0.9rem;align-items:flex-start;}
  #gameCanvas{display:block;border:1px solid rgba(255,68,102,0.2);box-shadow:0 0 25px rgba(255,68,102,0.1);cursor:pointer;}

  /* ── Side panel ── */
  .side{width:168px;display:flex;flex-direction:column;gap:0.7rem;}
  .panel{border:1px solid rgba(255,68,102,0.18);padding:0.6rem;background:var(--red3);}
  .panel h3{font-family:'Orbitron',sans-serif;font-size:0.5rem;letter-spacing:0.2em;color:rgba(255,68,102,0.4);margin-bottom:0.5rem;}
  .build-btn{width:100%;padding:0.38rem 0.5rem;margin-bottom:0.28rem;background:transparent;border:1px solid rgba(255,68,102,0.22);color:rgba(255,68,102,0.6);font-family:'Share Tech Mono',monospace;font-size:0.56rem;letter-spacing:0.05em;cursor:pointer;transition:all 0.15s;display:flex;justify-content:space-between;align-items:center;gap:0.3rem;}
  .build-btn:hover:not(:disabled){border-color:var(--red);color:var(--red);box-shadow:0 0 8px rgba(255,68,102,0.2);}
  .build-btn.active{border-color:var(--red);color:var(--red);background:rgba(255,68,102,0.1);box-shadow:0 0 12px rgba(255,68,102,0.25);}
  .build-btn:disabled{opacity:0.28;cursor:not-allowed;}
  .bcost{font-size:0.5rem;color:rgba(255,68,102,0.35);white-space:nowrap;}
  .build-btn.active .bcost{color:rgba(255,68,102,0.6);}
  .info-line{font-size:0.58rem;letter-spacing:0.07em;line-height:2.1;color:rgba(255,68,102,0.5);}
  .info-line span{color:var(--red);}
  .hp-wrap{background:rgba(255,68,102,0.08);height:5px;margin-top:0.25rem;border:1px solid rgba(255,68,102,0.12);}
  .hp-fill{height:100%;background:var(--red);box-shadow:0 0 6px var(--red);transition:width 0.4s;}
  .action-btn{width:100%;padding:0.42rem;background:transparent;border:1px solid var(--red);color:var(--red);font-family:'Orbitron',sans-serif;font-size:0.56rem;font-weight:700;letter-spacing:0.14em;cursor:pointer;transition:all 0.2s;box-shadow:0 0 8px rgba(255,68,102,0.12);}
  .action-btn:hover:not(:disabled){background:rgba(255,68,102,0.1);box-shadow:0 0 18px rgba(255,68,102,0.35);}
  .action-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .tooltip{font-size:0.55rem;color:rgba(255,68,102,0.35);line-height:1.6;margin-top:0.3rem;min-height:2.4rem;}

  /* ── Overlay ── */
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,0,4,0.95);backdrop-filter:blur(4px);gap:1rem;z-index:100;}
  #overlay h2{font-family:'Orbitron',sans-serif;font-size:clamp(1.3rem,4vw,2.2rem);letter-spacing:0.2em;color:var(--red);text-shadow:0 0 25px var(--red);}
  #overlay p{font-size:0.7rem;color:rgba(255,68,102,0.5);letter-spacing:0.1em;text-align:center;max-width:380px;line-height:1.9;}
  .ov-btn{padding:0.65rem 2rem;background:transparent;border:1px solid var(--red);color:var(--red);font-family:'Orbitron',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:0.2em;cursor:pointer;transition:all 0.2s;box-shadow:0 0 12px rgba(255,68,102,0.2);}
  .ov-btn:hover{background:rgba(255,68,102,0.1);box-shadow:0 0 25px rgba(255,68,102,0.45);transform:scale(1.04);}
  .ov-btn.sec{border-color:rgba(255,68,102,0.3);color:rgba(255,68,102,0.4);box-shadow:none;font-size:0.62rem;}
  .ov-btn.sec:hover{border-color:var(--red);color:var(--red);}
  .btn-row{display:flex;gap:0.8rem;flex-wrap:wrap;justify-content:center;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.4rem 2rem;font-size:0.65rem;letter-spacing:0.08em;color:rgba(255,68,102,0.5);}
  .stat-grid span{color:var(--red);}

  /* ── Upgrade overlay ── */
  #upgradeOverlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,0,4,0.96);backdrop-filter:blur(5px);gap:1rem;z-index:110;}
  #upgradeOverlay h2{font-family:'Orbitron',sans-serif;font-size:1.2rem;letter-spacing:0.25em;color:var(--red);text-shadow:0 0 20px var(--red);}
  #upgradeOverlay p{font-size:0.65rem;color:rgba(255,68,102,0.4);letter-spacing:0.1em;}
  .upg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.8rem;max-width:520px;}
  .upg-card{padding:0.85rem 0.75rem;border:1px solid rgba(255,68,102,0.28);background:rgba(255,68,102,0.04);cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;gap:0.4rem;text-align:center;}
  .upg-card:hover:not(.locked){border-color:var(--red);background:rgba(255,68,102,0.1);box-shadow:0 0 18px rgba(255,68,102,0.3);transform:translateY(-2px);}
  .upg-card.locked{opacity:0.3;cursor:not-allowed;}
  .upg-card.owned{border-color:rgba(255,68,102,0.5);background:rgba(255,68,102,0.07);}
  .upg-icon{font-size:1.5rem;}
  .upg-name{font-family:'Orbitron',sans-serif;font-size:0.55rem;font-weight:700;letter-spacing:0.15em;color:var(--red);}
  .upg-desc{font-size:0.53rem;color:rgba(255,68,102,0.5);line-height:1.5;}
  .upg-cost{font-size:0.5rem;color:rgba(255,68,102,0.35);margin-top:auto;}
  .upg-card.owned .upg-cost{color:rgba(255,68,102,0.5);}

  /* ── Log ── */
  #logEl{font-size:0.55rem;letter-spacing:0.05em;color:rgba(255,68,102,0.45);line-height:1.8;max-height:80px;overflow:hidden;display:flex;flex-direction:column-reverse;}
</style>
</head>
<body>
<a class="back-btn" href="../index.html">◀ ARCADE</a>

<div id="app">
  <h1>IRONHOLD</h1>
  <div class="top-bar">
    <div class="res-group">
      <div class="res"><span class="icon">🪵</span><span class="val" id="woodEl">0</span><span class="cap" id="woodCapEl">/100</span></div>
      <div class="res"><span class="icon">🪨</span><span class="val" id="stoneEl">0</span><span class="cap" id="stoneCapEl">/100</span></div>
      <div class="res"><span class="icon">⚙️</span><span class="val" id="ironEl">0</span><span class="cap" id="ironCapEl">/100</span></div>
    </div>
    <span class="divider">|</span>
    <div class="res"><span class="icon">💰</span><span class="val" id="goldEl">0</span></div>
    <span class="divider">|</span>
    <div class="phase-badge" id="phaseBadge">DAY 1</div>
    <div class="timer-wrap">⏱ <span class="timer-val" id="timerEl">60</span></div>
  </div>

  <div class="main">
    <canvas id="gameCanvas"></canvas>
    <div class="side">
      <div class="panel">
        <h3>BUILD</h3>
        <button class="build-btn" id="bb-WALL"     onclick="selectBuild('WALL')">    <span>🧱 WALL</span>     <span class="bcost" id="bc-WALL"></span></button>
        <button class="build-btn" id="bb-TOWER"    onclick="selectBuild('TOWER')">   <span>🗼 ARROW TWR</span><span class="bcost" id="bc-TOWER"></span></button>
        <button class="build-btn" id="bb-BALLISTA" onclick="selectBuild('BALLISTA')"><span>⚡ BALLISTA</span>  <span class="bcost" id="bc-BALLISTA"></span></button>
        <button class="build-btn" id="bb-SAWMILL"  onclick="selectBuild('SAWMILL')"> <span>🌲 SAWMILL</span>  <span class="bcost" id="bc-SAWMILL"></span></button>
        <button class="build-btn" id="bb-QUARRY"   onclick="selectBuild('QUARRY')">  <span>⛏ QUARRY</span>   <span class="bcost" id="bc-QUARRY"></span></button>
        <button class="build-btn" id="bb-MINE"     onclick="selectBuild('MINE')">    <span>🔩 MINE</span>     <span class="bcost" id="bc-MINE"></span></button>
        <button class="build-btn" id="bb-BARRACKS" onclick="selectBuild('BARRACKS')"><span>⚔️ BARRACKS</span> <span class="bcost" id="bc-BARRACKS"></span></button>
        <button class="build-btn" id="bb-TAVERN"   onclick="selectBuild('TAVERN')">  <span>🍺 TAVERN</span>   <span class="bcost" id="bc-TAVERN"></span></button>
        <div class="tooltip" id="buildTooltip">Select a building to place.</div>
      </div>
      <div class="panel">
        <h3>KEEP</h3>
        <div class="hp-wrap"><div class="hp-fill" id="keepHpBar" style="width:100%"></div></div>
        <div class="info-line" style="margin-top:0.35rem;">
          HP <span id="keepHpEl">100</span>/100<br>
          WAVE <span id="waveEl">0</span><br>
          SCORE <span id="scoreEl">0</span>
        </div>
      </div>
      <div class="panel">
        <button class="action-btn" id="endPhaseBtn">END DAY →</button>
      </div>
      <div class="panel">
        <h3>LOG</h3>
        <div id="logEl"></div>
      </div>
    </div>
  </div>
</div>

<!-- Main overlay -->
<div id="overlay">
  <h2 id="ovTitle">IRONHOLD</h2>
  <p id="ovDesc">Build your city by day. Defend it by night.<br>Survive the waves. Expand. Fortify. Hold the line.</p>
  <div class="stat-grid" id="ovStats" style="display:none;"></div>
  <div class="btn-row">
    <button class="ov-btn" id="ovStartBtn">BEGIN</button>
  </div>
</div>

<!-- Upgrade overlay -->
<div id="upgradeOverlay">
  <h2>UPGRADE RESEARCH</h2>
  <p id="upgSubtitle">WAVE COMPLETE — SPEND YOUR GOLD</p>
  <div class="upg-grid" id="upgGrid"></div>
  <button class="ov-btn sec" id="closeUpgBtn">CONTINUE →</button>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// CANVAS & GRID
// ════════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const COLS = 24, ROWS = 18;
const CS = Math.max(22, Math.min(30, Math.floor(Math.min(window.innerWidth * 0.64, window.innerHeight * 0.74) / COLS)));
canvas.width  = COLS * CS;
canvas.height = ROWS * CS;
const CX = canvas.width / 2, CY = canvas.height / 2;

// Keep position (center)
const KEEP_COL = Math.floor(COLS/2), KEEP_ROW = Math.floor(ROWS/2);

// ════════════════════════════════════════════════════════════════════════════
// BUILDING DEFINITIONS
// ════════════════════════════════════════════════════════════════════════════
const BDEFS = {
  KEEP:     {name:'KEEP',     icon:'⬡', hp:100, cost:{},           color:'#ff4466', desc:'Your stronghold. Protect it at all costs.'},
  WALL:     {name:'WALL',     icon:'█', hp:60,  cost:{wood:15,stone:10}, color:'#cc3355', desc:'Blocks enemy movement. Absorbs damage.'},
  TOWER:    {name:'ARROW TWR',icon:'↑', hp:40,  cost:{wood:20,stone:15}, color:'#ff3366', desc:'Shoots arrows at enemies. Medium range.', range:4, damage:8,  rate:1.2},
  BALLISTA: {name:'BALLISTA', icon:'✦', hp:35,  cost:{wood:15,iron:20},  color:'#ff2244', desc:'Piercing bolts. Long range, slow fire.',   range:6, damage:22, rate:0.4},
  SAWMILL:  {name:'SAWMILL',  icon:'🌲',hp:30,  cost:{wood:30,stone:10}, color:'#884422', desc:'Generates +3 wood per second.',  gen:{wood:3}},
  QUARRY:   {name:'QUARRY',   icon:'⛏', hp:30,  cost:{stone:30,wood:10}, color:'#886644', desc:'Generates +2 stone per second.', gen:{stone:2}},
  MINE:     {name:'MINE',     icon:'⚙',hp:30,  cost:{iron:20,stone:20}, color:'#668888', desc:'Generates +2 iron per second.',  gen:{iron:2}},
  BARRACKS: {name:'BARRACKS', icon:'⚔',hp:40,  cost:{wood:25,iron:15},  color:'#882233', desc:'Trains soldiers. +1 soldier per wave.'},
  TAVERN:   {name:'TAVERN',   icon:'🍺',hp:25,  cost:{wood:20,stone:10}, color:'#664422', desc:'Earns +8 gold per wave survived.'},
};

// ════════════════════════════════════════════════════════════════════════════
// UPGRADE TREE
// ════════════════════════════════════════════════════════════════════════════
const UPGRADES = [
  {id:'steel_walls',   name:'STEEL WALLS',   icon:'🛡', cost:60,  desc:'+50% wall HP',           req:null,         apply:()=>{G.mods.wallHp=1.5;  rebuildHp('WALL');}},
  {id:'fire_arrows',   name:'FIRE ARROWS',   icon:'🔥', cost:80,  desc:'+80% tower damage',      req:null,         apply:()=>{G.mods.towerDmg=1.8;  }},
  {id:'rapid_fire',    name:'RAPID FIRE',    icon:'⚡', cost:100, desc:'+60% tower attack speed', req:'fire_arrows',apply:()=>{G.mods.towerRate=1.6; }},
  {id:'siege_bolts',   name:'SIEGE BOLTS',   icon:'💥', cost:90,  desc:'+100% ballista damage',  req:null,         apply:()=>{G.mods.ballDmg=2.0;   }},
  {id:'lumberjack',    name:'LUMBERJACK',    icon:'🪵', cost:50,  desc:'Sawmills produce +5/s',  req:null,         apply:()=>{G.mods.woodGen=2;     }},
  {id:'iron_drill',    name:'IRON DRILL',    icon:'⛏', cost:60,  desc:'Mines produce +3/s',     req:null,         apply:()=>{G.mods.ironGen=2;     }},
  {id:'veteran_troops',name:'VETERANS',      icon:'⚔', cost:80,  desc:'Soldiers deal 2x damage',req:null,         apply:()=>{G.mods.soldierDmg=2;  }},
  {id:'stonemason',    name:'STONEMASON',    icon:'🪨', cost:50,  desc:'Quarries produce +3/s',  req:null,         apply:()=>{G.mods.stoneGen=2;    }},
  {id:'fortify',       name:'FORTIFY',       icon:'🏰', cost:120, desc:'Keep gains +50 max HP',  req:'steel_walls',apply:()=>{G.keepMaxHp+=50; G.keepHp=Math.min(G.keepHp+30,G.keepMaxHp);}},
];

// ════════════════════════════════════════════════════════════════════════════
// ENEMY DEFINITIONS
// ════════════════════════════════════════════════════════════════════════════
const EDEFS = {
  RUNNER:  {name:'RUNNER', hp:25,  speed:1.6, damage:4,  reward:6,  color:'#ff6644', size:0.28},
  BRUTE:   {name:'BRUTE',  hp:80,  speed:0.8, damage:12, reward:15, color:'#ff2200', size:0.38},
  RAM:     {name:'RAM',    hp:160, speed:0.5, damage:25, reward:25, color:'#cc1100', size:0.46},
};

// ════════════════════════════════════════════════════════════════════════════
// GAME STATE
// ════════════════════════════════════════════════════════════════════════════
let G = {};
let particles = [], floaters = [];
let selectedBuild = null;
let hoverCell = null;
let raf = null, lastTs = 0;
let resTimer = 0;
let spawnQueue = [], spawnTimer = 0;
let phaseTimer = 0;

function initGame() {
  G = {
    phase: 'day',      // 'day' | 'night' | 'upgrade'
    wave: 0,
    score: 0,
    bestScore: 0,
    dayDuration: 60,
    wood: 60, stone: 40, iron: 20, gold: 30,
    woodCap: 150, stoneCap: 150, ironCap: 100,
    keepHp: 100, keepMaxHp: 100,
    buildings: [],     // {type, col, row, hp, maxHp, cooldown, id}
    enemies: [],
    soldiers: [],
    projectiles: [],
    ownedUpgrades: new Set(),
    mods: {wallHp:1, towerDmg:1, towerRate:1, ballDmg:1, woodGen:1, stoneGen:1, ironGen:1, soldierDmg:1},
    idCounter: 0,
    running: true,
  };
  // Place keep
  placeBuilding('KEEP', KEEP_COL, KEEP_ROW, true);
  // Starter walls (ring around keep)
  const wallRing = [[-2,-2],[-2,-1],[-2,0],[-2,1],[-2,2],[-1,-2],[-1,2],[0,-2],[0,2],[1,-2],[1,2],[2,-2],[2,-1],[2,0],[2,1],[2,2]];
  for (const [dr,dc] of wallRing) placeBuilding('WALL', KEEP_COL+dc, KEEP_ROW+dr, true);

  phaseTimer = G.dayDuration * 1000;
  selectedBuild = null;
  particles = []; floaters = [];
  spawnQueue = []; spawnTimer = 0; resTimer = 0;

  document.getElementById('overlay').style.display = 'none';
  document.getElementById('upgradeOverlay').style.display = 'none';
  document.getElementById('endPhaseBtn').disabled = false;
  document.getElementById('endPhaseBtn').textContent = 'END DAY →';
  updateBuildButtons();
  updateHUD();
  lastTs = performance.now();
  if (raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function placeBuilding(type, col, row, free=false) {
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return false;
  if (G.buildings.find(b=>b.col===col&&b.row===row)) return false;
  const def = BDEFS[type];
  if (!free) {
    for (const [res,amt] of Object.entries(def.cost)) {
      if (G[res] < amt) return false;
    }
    for (const [res,amt] of Object.entries(def.cost)) G[res] -= amt;
  }
  let hp = def.hp;
  if (type==='WALL') hp = Math.round(def.hp * G.mods.wallHp);
  G.buildings.push({type, col, row, hp, maxHp:hp, cooldown:0, id:G.idCounter++, trained:0});
  if (type==='BARRACKS') spawnSoldier();
  updateHUD(); updateBuildButtons();
  return true;
}

function rebuildHp(type) {
  for (const b of G.buildings) {
    if (b.type !== type) continue;
    const def = BDEFS[type];
    const mod = type==='WALL'?G.mods.wallHp:1;
    b.maxHp = Math.round(def.hp*mod); b.hp = b.maxHp;
  }
}

// ════════════════════════════════════════════════════════════════════════════
// SOLDIERS
// ════════════════════════════════════════════════════════════════════════════
function spawnSoldier() {
  G.soldiers.push({
    x: KEEP_COL*CS+CS/2 + (Math.random()-0.5)*CS*2,
    y: KEEP_ROW*CS+CS/2 + (Math.random()-0.5)*CS*2,
    hp:30, maxHp:30, damage:10*G.mods.soldierDmg,
    speed:1.2, cooldown:0, target:null, id:G.idCounter++,
  });
}

// ════════════════════════════════════════════════════════════════════════════
// WAVE SPAWNING
// ════════════════════════════════════════════════════════════════════════════
function buildWave(wave) {
  const q = [];
  const runners = 4  + wave * 3;
  const brutes  = Math.max(0, wave - 1) * 2;
  const rams    = Math.max(0, wave - 3);
  for (let i=0;i<runners;i++) q.push('RUNNER');
  for (let i=0;i<brutes;i++)  q.push('BRUTE');
  for (let i=0;i<rams;i++)    q.push('RAM');
  // Shuffle
  for (let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
  return q;
}

function spawnEnemy(type) {
  const def = {...EDEFS[type]};
  const scale = 1 + (G.wave-1)*0.1;
  def.hp    = Math.round(def.hp * scale);
  def.maxHp = def.hp;
  def.damage = Math.round(def.damage * scale);
  // Spawn from random edge
  const side = Math.floor(Math.random()*4);
  let x, y;
  if (side===0){x=Math.random()*canvas.width; y=-CS;}
  else if(side===1){x=canvas.width+CS; y=Math.random()*canvas.height;}
  else if(side===2){x=Math.random()*canvas.width; y=canvas.height+CS;}
  else{x=-CS; y=Math.random()*canvas.height;}
  G.enemies.push({...def, x, y, id:G.idCounter++, target:null, cooldown:0});
}

// ════════════════════════════════════════════════════════════════════════════
// PATHFINDING (simple: move toward keep, blocked by walls)
// ════════════════════════════════════════════════════════════════════════════
function buildingAt(col, row) {
  return G.buildings.find(b=>b.col===col&&b.row===row&&b.hp>0);
}

function moveEnemy(e, dt) {
  const speed = e.speed * dt * 1.5;

  // Decrement attack cooldown
  if (e.cooldown > 0) e.cooldown -= dt;

  // Find closest building
  let closestBld = null, closestDist = Infinity;
  for (const b of G.buildings) {
    if (b.hp <= 0) continue;
    const bx=b.col*CS+CS/2, by=b.row*CS+CS/2;
    const d=Math.sqrt((e.x-bx)**2+(e.y-by)**2);
    if (d < closestDist) { closestDist=d; closestBld=b; }
  }

  if (!closestBld) return;

  if (closestDist < CS * 1.1) {
    // Attack
    if (e.cooldown <= 0) {
      closestBld.hp -= e.damage;
      e.cooldown = 90;
      burst(e.x, e.y, '#ff2200', 4);
      if (closestBld.type === 'KEEP') {
        G.keepHp = Math.max(0, G.keepHp - e.damage * 0.5);
        updateHUD();
        if (G.keepHp <= 0) { gameOver(); return; }
      }
      if (closestBld.hp <= 0) {
        G.buildings = G.buildings.filter(b=>b.id!==closestBld.id);
        addLog(`${BDEFS[closestBld.type].name} destroyed!`);
      }
    }
    return;
  }

  // Move toward closest building
  const tx = closestBld.col*CS+CS/2 - e.x;
  const ty = closestBld.row*CS+CS/2 - e.y;
  const td = Math.sqrt(tx*tx+ty*ty);
  if (td > 0) { e.x += (tx/td)*speed; e.y += (ty/td)*speed; }
}

// ════════════════════════════════════════════════════════════════════════════
// MAIN LOOP
// ════════════════════════════════════════════════════════════════════════════
function loop(ts) {
  const dt = Math.min((ts-lastTs)/16.67, 3); lastTs = ts;
  if (G.running) update(dt, ts-lastTs);
  draw();
  raf = requestAnimationFrame(loop);
}

function update(dt, dtMs) {
  // Particles & floaters
  for (const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.06*dt;p.life-=p.decay*dt;}
  particles = particles.filter(p=>p.life>0);
  for (const f of floaters){f.y-=0.8*dt;f.life-=0.02*dt;}
  floaters = floaters.filter(f=>f.life>0);

  if (G.phase === 'day') {
    phaseTimer -= dtMs;
    // Resource generation
    resTimer += dtMs;
    if (resTimer >= 1000) {
      resTimer -= 1000;
      for (const b of G.buildings) {
        const def = BDEFS[b.type];
        if (!def.gen) continue;
        if (def.gen.wood)  G.wood  = Math.min(G.woodCap,  G.wood  + def.gen.wood  * G.mods.woodGen);
        if (def.gen.stone) G.stone = Math.min(G.stoneCap, G.stone + def.gen.stone * G.mods.stoneGen);
        if (def.gen.iron)  G.iron  = Math.min(G.ironCap,  G.iron  + def.gen.iron  * G.mods.ironGen);
      }
      updateHUD();
    }
    if (phaseTimer <= 0) startNight();
    updateBuildButtons();

  } else if (G.phase === 'night') {
    // Spawn enemies on a ms timer
    if (spawnQueue.length > 0) {
      spawnTimer -= dtMs;
      if (spawnTimer <= 0) {
        spawnEnemy(spawnQueue.shift());
        spawnTimer = Math.max(500, 1400 - G.wave * 60);
      }
    }

    // Update enemies
    for (const e of G.enemies) {
      moveEnemy(e, dt);
    }
    // Remove dead enemies, award gold
    G.enemies = G.enemies.filter(e => {
      if (e.hp <= 0) {
        G.score += e.reward; G.gold += e.reward;
        floatText(`+${e.reward}g`, e.x, e.y, '#ffaa00');
        burst(e.x, e.y, e.color, 10);
        return false;
      }
      return true;
    });

    // Update soldiers
    for (const s of G.soldiers) {
      if (s.hp <= 0) continue;
      s.cooldown -= dt;
      let nearest = null, nd = Infinity;
      for (const e of G.enemies) {
        const d = Math.hypot(s.x-e.x, s.y-e.y);
        if (d < nd) { nd=d; nearest=e; }
      }
      if (nearest && nd < 5*CS) {
        const dx=nearest.x-s.x, dy=nearest.y-s.y, d=Math.hypot(dx,dy);
        if (d > CS*0.9) { s.x+=dx/d*s.speed*dt; s.y+=dy/d*s.speed*dt; }
        if (s.cooldown<=0 && d<CS*1.4) {
          nearest.hp -= s.damage;
          s.cooldown = 50;
          burst(nearest.x, nearest.y, '#ffcc44', 3);
        }
      } else {
        const angle = Date.now()*0.0008 + s.id*1.3;
        const px=KEEP_COL*CS+CS/2+Math.cos(angle)*CS*2.8;
        const py=KEEP_ROW*CS+CS/2+Math.sin(angle)*CS*2.8;
        const dx=px-s.x, dy=py-s.y, d=Math.hypot(dx,dy);
        if (d>4) { s.x+=dx/d*s.speed*dt*0.5; s.y+=dy/d*s.speed*dt*0.5; }
      }
    }
    G.soldiers = G.soldiers.filter(s=>s.hp>0);

    // Tower & ballista shooting
    for (const b of G.buildings) {
      const def = BDEFS[b.type];
      if (!def.range) continue;
      b.cooldown -= dt;
      if (b.cooldown > 0) continue;
      const bx=b.col*CS+CS/2, by=b.row*CS+CS/2;
      let target=null, best=Infinity;
      for (const e of G.enemies) {
        const d=Math.hypot(bx-e.x, by-e.y);
        if (d < def.range*CS && d < best) { best=d; target=e; }
      }
      if (!target) continue;
      let dmg  = def.damage * (b.type==='TOWER'?G.mods.towerDmg:b.type==='BALLISTA'?G.mods.ballDmg:1);
      let rate = def.rate   * (b.type==='TOWER'?G.mods.towerRate:1);
      G.projectiles.push({
        x:bx, y:by, target, dmg,
        speed: 5,  // pixels per frame
        color: b.type==='BALLISTA'?'#ffcc44':'#ff88aa',
        id: G.idCounter++
      });
      b.cooldown = 60 / rate;
    }

    // Move projectiles — speed is px/frame
    for (const p of G.projectiles) {
      if (!p.target || p.target.hp<=0) { p.done=true; continue; }
      const dx=p.target.x-p.x, dy=p.target.y-p.y, d=Math.hypot(dx,dy);
      const step = p.speed * dt;
      if (d <= step + 2) {
        // Hit
        p.target.hp -= p.dmg;
        burst(p.target.x, p.target.y, p.color, 4);
        p.done=true;
      } else {
        p.x += (dx/d)*step;
        p.y += (dy/d)*step;
      }
    }
    G.projectiles = G.projectiles.filter(p=>!p.done);

    updateHUD();

    // Wave complete — only when ALL spawned AND all dead
    if (spawnQueue.length===0 && G.enemies.length===0 && G.phase==='night') {
      waveComplete();
    }
    updateHUD();
  }
}

// ════════════════════════════════════════════════════════════════════════════
// PHASE TRANSITIONS
// ════════════════════════════════════════════════════════════════════════════
function startNight() {
  G.phase = 'night';
  G.wave++;
  spawnQueue = buildWave(G.wave);
  spawnTimer = 800;
  G.projectiles = [];
  document.getElementById('endPhaseBtn').disabled = true;
  document.getElementById('endPhaseBtn').textContent = 'WAVE ACTIVE';
  document.getElementById('phaseBadge').textContent  = `WAVE ${G.wave}`;
  document.getElementById('phaseBadge').className    = 'phase-badge night';
  addLog(`⚔ Wave ${G.wave} incoming!`);
  updateHUD();
}

function waveComplete() {
  G.phase = 'upgrade';
  // Gold from buildings
  const taverns = G.buildings.filter(b=>b.type==='TAVERN').length;
  const bonus   = taverns * 8;
  G.gold  += 20 + G.wave*5 + bonus;
  G.score += G.wave * 50;
  if (G.score > G.bestScore) G.bestScore = G.score;
  // Repair keep slightly
  G.keepHp = Math.min(G.keepMaxHp, G.keepHp + 5);
  // Train soldiers from barracks
  const barracks = G.buildings.filter(b=>b.type==='BARRACKS').length;
  for (let i=0;i<barracks;i++) spawnSoldier();
  addLog(`✓ Wave ${G.wave} survived! +${20+G.wave*5+bonus}g`);
  updateHUD();
  setTimeout(showUpgradeScreen, 500);
}

function resumeDay() {
  G.phase = 'day';
  phaseTimer = G.dayDuration * 1000;
  document.getElementById('endPhaseBtn').disabled = false;
  document.getElementById('endPhaseBtn').textContent = 'END DAY →';
  document.getElementById('phaseBadge').textContent  = `DAY ${G.wave+1}`;
  document.getElementById('phaseBadge').className    = 'phase-badge';
  document.getElementById('upgradeOverlay').style.display = 'none';
  updateBuildButtons();
  updateHUD();
}

// ════════════════════════════════════════════════════════════════════════════
// UPGRADE SCREEN
// ════════════════════════════════════════════════════════════════════════════
function showUpgradeScreen() {
  document.getElementById('upgSubtitle').textContent = `WAVE ${G.wave} COMPLETE — GOLD: ${G.gold}`;
  const grid = document.getElementById('upgGrid');
  grid.innerHTML='';
  for (const upg of UPGRADES) {
    const owned   = G.ownedUpgrades.has(upg.id);
    const reqMet  = !upg.req || G.ownedUpgrades.has(upg.req);
    const canAfford = G.gold >= upg.cost;
    const el = document.createElement('div');
    el.className = `upg-card${owned?' owned':''}${!reqMet?' locked':''}`;
    el.innerHTML = `<div class="upg-icon">${upg.icon}</div>
      <div class="upg-name">${upg.name}</div>
      <div class="upg-desc">${upg.desc}</div>
      <div class="upg-cost">${owned?'✓ OWNED':`${upg.cost}g${!reqMet?' (locked)':!canAfford?' (need more gold)':''}`}</div>`;
    if (!owned && reqMet && canAfford) {
      el.onclick = () => { G.gold-=upg.cost; G.ownedUpgrades.add(upg.id); upg.apply(); showUpgradeScreen(); };
    }
    grid.appendChild(el);
  }
  document.getElementById('upgradeOverlay').style.display='flex';
}

document.getElementById('closeUpgBtn').onclick = resumeDay;

// ════════════════════════════════════════════════════════════════════════════
// DRAWING
// ════════════════════════════════════════════════════════════════════════════
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Background grid
  ctx.strokeStyle='rgba(255,68,102,0.035)';ctx.lineWidth=0.5;
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*CS,0);ctx.lineTo(c*CS,canvas.height);ctx.stroke();}
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*CS);ctx.lineTo(canvas.width,r*CS);ctx.stroke();}

  // Night vignette
  if (G.phase==='night') {
    const vg=ctx.createRadialGradient(CX,CY,CS*3,CX,CY,canvas.width*0.75);
    vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(40,0,0,0.35)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  // Build preview
  if (selectedBuild && hoverCell && G.phase==='day') {
    const {col,row}=hoverCell;
    const canPlace=!buildingAt(col,row)&&col>=0&&col<COLS&&row>=0&&row<ROWS;
    ctx.fillStyle=canPlace?'rgba(255,68,102,0.18)':'rgba(255,0,0,0.12)';
    ctx.fillRect(col*CS,row*CS,CS,CS);
    ctx.strokeStyle=canPlace?'rgba(255,68,102,0.6)':'rgba(255,0,0,0.4)';
    ctx.lineWidth=1.5;ctx.strokeRect(col*CS+1,row*CS+1,CS-2,CS-2);
    // Range preview
    const def=BDEFS[selectedBuild];
    if (def.range) {
      ctx.strokeStyle='rgba(255,68,102,0.12)';ctx.lineWidth=1;ctx.setLineDash([3,4]);
      ctx.beginPath();ctx.arc(col*CS+CS/2,row*CS+CS/2,def.range*CS,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    }
  }

  // Buildings
  for (const b of G.buildings) {
    if (b.hp<=0) continue;
    const x=b.col*CS, y=b.row*CS, def=BDEFS[b.type];
    const hpPct=b.hp/b.maxHp;

    // Fill
    ctx.fillStyle=hpPct>0.5?`${def.color}22`:`rgba(255,0,0,0.12)`;
    ctx.fillRect(x,y,CS,CS);

    // Border
    ctx.strokeStyle=hpPct>0.5?def.color:`rgba(255,80,0,0.8)`;
    ctx.lineWidth=b.type==='KEEP'?2:1;
    ctx.shadowColor=def.color;ctx.shadowBlur=b.type==='KEEP'?14:5;
    ctx.strokeRect(x+1,y+1,CS-2,CS-2);
    ctx.shadowBlur=0;

    // Icon
    ctx.font=`${CS*0.52}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=def.color;
    ctx.shadowColor=def.color;ctx.shadowBlur=6;
    ctx.fillText(def.icon, x+CS/2, y+CS/2);
    ctx.shadowBlur=0;

    // HP bar (only if damaged)
    if (hpPct<1) {
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(x+1,y+CS-5,CS-2,4);
      ctx.fillStyle=hpPct>0.5?'#44ff88':hpPct>0.25?'#ffaa00':'#ff2200';
      ctx.fillRect(x+1,y+CS-5,(CS-2)*hpPct,4);
    }
  }

  // Soldiers
  for (const s of G.soldiers) {
    if (s.hp<=0) continue;
    ctx.fillStyle='#ffcc44';ctx.shadowColor='#ffcc44';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(s.x,s.y,CS*0.22,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Sword icon
    ctx.fillStyle='rgba(255,200,0,0.8)';ctx.font=`${CS*0.32}px serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⚔',s.x,s.y);
  }

  // Enemies
  for (const e of G.enemies) {
    if (e.hp<=0) continue;
    ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(e.x,e.y,e.size*CS,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // HP bar
    const bw=e.size*CS*2.5,bh=3,bx=e.x-bw/2,by=e.y-e.size*CS-5;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=e.color;ctx.fillRect(bx,by,bw*(e.hp/e.maxHp),bh);
  }

  // Projectiles
  for (const p of G.projectiles) {
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=4;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;

  // Floating text
  for (const f of floaters) {
    ctx.globalAlpha=f.life;ctx.fillStyle=f.color;
    ctx.font=`bold ${CS*0.42}px Share Tech Mono`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;

  // Day timer bar
  if (G.phase==='day') {
    const pct=phaseTimer/(G.dayDuration*1000);
    ctx.fillStyle='rgba(255,68,102,0.12)';ctx.fillRect(0,0,canvas.width,4);
    ctx.fillStyle='rgba(255,68,102,0.6)';ctx.fillRect(0,0,canvas.width*pct,4);
    // Update timer display
    document.getElementById('timerEl').textContent=Math.ceil(phaseTimer/1000);
  } else {
    document.getElementById('timerEl').textContent='--';
  }

  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

// ════════════════════════════════════════════════════════════════════════════
// PARTICLES & FLOATERS
// ════════════════════════════════════════════════════════════════════════════
function burst(x,y,color,count=8){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=1.5+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:0.04+Math.random()*0.04,r:1.5+Math.random()*2,color});
  }
}
function floatText(text,x,y,color){
  floaters.push({text,x,y,color,life:1});
}

// ════════════════════════════════════════════════════════════════════════════
// CANVAS INTERACTION
// ════════════════════════════════════════════════════════════════════════════
canvas.addEventListener('mousemove', e => {
  const r=canvas.getBoundingClientRect();
  const col=Math.floor((e.clientX-r.left)/CS), row=Math.floor((e.clientY-r.top)/CS);
  hoverCell = (col>=0&&col<COLS&&row>=0&&row<ROWS)?{col,row}:null;
  // Tooltip
  if (hoverCell) {
    const b=buildingAt(col,row);
    if (b) {
      const def=BDEFS[b.type];
      document.getElementById('buildTooltip').textContent=`${def.name} — HP ${b.hp}/${b.maxHp}`;
    } else if (!selectedBuild) {
      document.getElementById('buildTooltip').textContent='Click to place selected building.';
    }
  }
});
canvas.addEventListener('mouseleave',()=>{hoverCell=null;});
canvas.addEventListener('click', e => {
  if (!G.running || G.phase!=='day' || !selectedBuild) return;
  const r=canvas.getBoundingClientRect();
  const col=Math.floor((e.clientX-r.left)/CS), row=Math.floor((e.clientY-r.top)/CS);
  if (col<0||col>=COLS||row<0||row>=ROWS) return;
  if (col===KEEP_COL&&row===KEEP_ROW) return;
  const placed=placeBuilding(selectedBuild,col,row);
  if (!placed) floatText('Need resources!', e.clientX-canvas.getBoundingClientRect().left, row*CS, '#ff4466');
});
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  selectedBuild=null;
  document.querySelectorAll('.build-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('buildTooltip').textContent='Select a building to place.';
});

function selectBuild(type) {
  if (G.phase!=='day') return;
  selectedBuild = selectedBuild===type ? null : type;
  document.querySelectorAll('.build-btn').forEach(b=>b.classList.remove('active'));
  if (selectedBuild) {
    document.getElementById('bb-'+type).classList.add('active');
    const def=BDEFS[type];
    const costStr=Object.entries(def.cost).map(([r,a])=>`${a} ${r}`).join(', ');
    document.getElementById('buildTooltip').textContent=`${def.desc} Cost: ${costStr||'free'}`;
  } else {
    document.getElementById('buildTooltip').textContent='Select a building to place.';
  }
}

document.getElementById('endPhaseBtn').onclick = () => {
  if (G.phase==='day') startNight();
};

// ════════════════════════════════════════════════════════════════════════════
// HUD
// ════════════════════════════════════════════════════════════════════════════
function updateHUD() {
  document.getElementById('woodEl').textContent  = Math.floor(G.wood);
  document.getElementById('stoneEl').textContent = Math.floor(G.stone);
  document.getElementById('ironEl').textContent  = Math.floor(G.iron);
  document.getElementById('goldEl').textContent  = Math.floor(G.gold);
  document.getElementById('woodCapEl').textContent  = '/'+G.woodCap;
  document.getElementById('stoneCapEl').textContent = '/'+G.stoneCap;
  document.getElementById('ironCapEl').textContent  = '/'+G.ironCap;
  document.getElementById('keepHpEl').textContent   = Math.ceil(G.keepHp);
  document.getElementById('keepHpBar').style.width  = `${(G.keepHp/G.keepMaxHp)*100}%`;
  document.getElementById('waveEl').textContent  = G.wave;
  document.getElementById('scoreEl').textContent = G.score;
}

function updateBuildButtons() {
  for (const [type,def] of Object.entries(BDEFS)) {
    const btn=document.getElementById('bc-'+type);
    if (!btn) continue;
    const costStr=Object.entries(def.cost).map(([r,a])=>`${a}${r[0]}`).join(' ');
    btn.textContent=costStr||'free';
    const canAfford=Object.entries(def.cost).every(([r,a])=>G[r]>=a);
    document.getElementById('bb-'+type).disabled=(!canAfford||G.phase!=='day');
  }
}

// LOG

const logLines = [];
function addLog(msg) {
  logLines.push(msg);
  if (logLines.length>6) logLines.shift();
  document.getElementById('logEl').innerHTML=logLines.map(l=>`<div>${l}</div>`).join('');
}

// GAME OVER
// ════════════════════════════════════════════════════════════════════════════
function gameOver() {
  G.running=false;
  if (G.score>G.bestScore) G.bestScore=G.score;
  const ov=document.getElementById('overlay');
  ov.style.display='flex';
  document.getElementById('ovTitle').textContent='IRONHOLD FELL';
  document.getElementById('ovDesc').textContent=`Your keep was destroyed on wave ${G.wave}.`;
  const stats=document.getElementById('ovStats');
  stats.style.display='grid';
  stats.innerHTML=`SCORE<span>${G.score}</span>BEST<span>${G.bestScore}</span>WAVES<span>${G.wave}</span>GOLD<span>${Math.floor(G.gold)}</span>`;
  document.getElementById('ovStartBtn').textContent='NEW RUN';
}
