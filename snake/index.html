<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Share Tech Mono', monospace;
    color: #00ff88;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,136,0.015) 2px, rgba(0,255,136,0.015) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,255,136,0.015) 2px, rgba(0,255,136,0.015) 4px);
    pointer-events: none;
    z-index: 10;
  }

  /* Back button */
  .back-btn {
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.9rem;
    background: transparent;
    border: 1px solid rgba(0,255,136,0.3);
    color: rgba(0,255,136,0.5);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-decoration: none;
    transition: all 0.2s;
    cursor: pointer;
  }
  .back-btn:hover {
    border-color: #00ff88;
    color: #00ff88;
    box-shadow: 0 0 12px rgba(0,255,136,0.2);
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    letter-spacing: 0.3em;
    color: #00ff88;
    text-shadow: 0 0 20px #00ff88, 0 0 60px rgba(0,255,136,0.4);
    margin-bottom: 0.4rem;
    text-transform: uppercase;
  }

  .score-bar {
    display: flex;
    gap: 2.5rem;
    margin-bottom: 1rem;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: rgba(0,255,136,0.6);
  }

  .score-bar span { color: #00ff88; font-weight: bold; }

  .canvas-wrap {
    position: relative;
    border: 1px solid rgba(0,255,136,0.3);
    box-shadow:
      0 0 0 1px rgba(0,255,136,0.1),
      0 0 30px rgba(0,255,136,0.15),
      inset 0 0 30px rgba(0,0,0,0.5);
  }

  canvas {
    display: block;
    background: #050508;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,5,8,0.88);
    backdrop-filter: blur(2px);
    gap: 1rem;
  }

  #overlay h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.2rem, 4vw, 2rem);
    letter-spacing: 0.2em;
    color: #00ff88;
    text-shadow: 0 0 20px #00ff88;
  }

  #overlay p {
    font-size: 0.8rem;
    color: rgba(0,255,136,0.5);
    letter-spacing: 0.1em;
  }

  #overlay .final-score {
    font-size: 1rem;
    color: rgba(0,255,136,0.7);
    letter-spacing: 0.15em;
  }

  button {
    margin-top: 0.5rem;
    padding: 0.6rem 2.2rem;
    background: transparent;
    border: 1px solid #00ff88;
    color: #00ff88;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 10px rgba(0,255,136,0.2);
  }

  button:hover {
    background: rgba(0,255,136,0.12);
    box-shadow: 0 0 20px rgba(0,255,136,0.4);
    transform: scale(1.04);
  }

  .hint {
    margin-top: 0.8rem;
    font-size: 0.7rem;
    color: rgba(0,255,136,0.3);
    letter-spacing: 0.1em;
    text-align: center;
  }
</style>
</head>
<body>

<a class="back-btn" href="../index.html">◀ ARCADE</a>

<h1>Snake</h1>
<div class="score-bar">
  SCORE <span id="scoreDisplay">0</span>
  &nbsp;&nbsp;|&nbsp;&nbsp;
  BEST <span id="bestDisplay">0</span>
</div>

<div class="canvas-wrap">
  <canvas id="c"></canvas>

  <div id="overlay">
    <h2 id="overlayTitle">SNAKE</h2>
    <p id="overlayMsg">Navigate. Eat. Grow.</p>
    <div class="final-score" id="finalScore"></div>
    <button id="startBtn">START GAME</button>
    <div class="hint">WASD or Arrow Keys &nbsp;·&nbsp; Space to pause</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayMsg = document.getElementById('overlayMsg');
const finalScore = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');
const scoreDisplay = document.getElementById('scoreDisplay');
const bestDisplay = document.getElementById('bestDisplay');

const COLS = 24, ROWS = 24;
const size = Math.min(Math.floor(Math.min(window.innerWidth * 0.9, window.innerHeight * 0.68) / COLS) * COLS, 480);
const CELL = size / COLS;
canvas.width = size;
canvas.height = size;

let snake, dir, nextDir, food, score, best = 0, gameLoop, state = 'idle', paused = false;

function initGame() {
  const mid = Math.floor(COLS / 2);
  snake = [{x: mid, y: mid}, {x: mid-1, y: mid}, {x: mid-2, y: mid}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  scoreDisplay.textContent = 0;
  placeFood();
}

function placeFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  let pos;
  do { pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)}; }
  while (occupied.has(`${pos.x},${pos.y}`));
  food = pos;
}

function step() {
  if (paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return endGame();
  if (snake.some(s => s.x === head.x && s.y === head.y)) return endGame();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreDisplay.textContent = score;
    if (score > best) { best = score; bestDisplay.textContent = best; }
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(0,255,136,0.04)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(canvas.width, y*CELL); ctx.stroke();
  }
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    const ratio = 1 - (i / snake.length) * 0.65;
    const alpha = isHead ? 1 : ratio;
    const pad = isHead ? 1 : 2;
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = isHead ? 18 : 6;
    ctx.fillStyle = `rgba(0,255,${Math.round(136 * alpha + 88 * (1-alpha))},${alpha})`;
    ctx.fillRect(seg.x*CELL+pad, seg.y*CELL+pad, CELL-pad*2, CELL-pad*2);
    if (isHead) {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(seg.x*CELL+pad+2, seg.y*CELL+pad+2, CELL*0.3, CELL*0.3);
    }
    ctx.shadowBlur = 0;
  });
  const pulse = 0.7 + 0.3 * Math.sin(Date.now() * 0.006);
  ctx.shadowColor = '#ff4466';
  ctx.shadowBlur = 18 * pulse;
  ctx.fillStyle = `rgba(255,${Math.round(60 + 20*pulse)},100,1)`;
  const fp = 3;
  ctx.fillRect(food.x*CELL+fp, food.y*CELL+fp, CELL-fp*2, CELL-fp*2);
  ctx.fillStyle = 'rgba(255,200,200,0.5)';
  ctx.fillRect(food.x*CELL+fp+2, food.y*CELL+fp+2, CELL*0.28, CELL*0.28);
  ctx.shadowBlur = 0;
}

function endGame() {
  clearInterval(gameLoop);
  state = 'dead';
  overlayTitle.textContent = 'GAME OVER';
  overlayMsg.textContent = '';
  finalScore.textContent = `SCORE: ${score}`;
  startBtn.textContent = 'PLAY AGAIN';
  overlay.style.display = 'flex';
}

startBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
  initGame();
  draw();
  clearInterval(gameLoop);
  gameLoop = setInterval(step, 120);
  state = 'playing';
  paused = false;
});

document.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d'].includes(k)) e.preventDefault();
  if (k === ' ' && state === 'playing') { paused = !paused; if (!paused) draw(); return; }
  const moves = {
    ArrowUp: {x:0,y:-1}, w: {x:0,y:-1},
    ArrowDown: {x:0,y:1}, s: {x:0,y:1},
    ArrowLeft: {x:-1,y:0}, a: {x:-1,y:0},
    ArrowRight: {x:1,y:0}, d: {x:1,y:0},
  };
  const m = moves[k];
  if (m && !(m.x === -dir.x && m.y === -dir.y)) nextDir = m;
});

let tx = 0, ty = 0;
canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    const m = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
    if (!(m.x === -dir.x)) nextDir = m;
  } else {
    const m = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
    if (!(m.y === -dir.y)) nextDir = m;
  }
}, {passive:true});

function idleDraw() {
  if (state !== 'idle') return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(0,255,136,0.04)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, canvas.height); ctx.stroke(); }
  for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(canvas.width, y*CELL); ctx.stroke(); }
  requestAnimationFrame(idleDraw);
}
idleDraw();

(function pulse() {
  if (state === 'playing' && !paused) draw();
  setTimeout(pulse, 80);
})();
</script>
</body>
</html>
